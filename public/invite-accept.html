<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Join Server — MINECORD</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#5865f2">
<style>
@font-face{font-family:'VT323';src:url('/fonts/vt323.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'IBM Plex Sans';src:url('/fonts/ibm-plex-sans-regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'IBM Plex Sans';src:url('/fonts/ibm-plex-sans-semibold.ttf') format('truetype');font-weight:600;font-display:swap}
:root{--font-minecraft:'VT323',ui-monospace,Consolas,monospace;--font-ui:'IBM Plex Sans',system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--blue:#5865f2;--green:#23a559;--red:#da373c;--muted:#b5bac1;--panel:#1e1f22;--line:#2b2d31;--input:#2a2c31;--border:#3e4147}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#313338;color:#f2f4f7;font-family:var(--font-ui);display:flex;align-items:center;justify-content:center;padding:24px}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
.container{width:100%;max-width:480px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.badge{width:64px;height:64px;border-radius:16px;background:rgba(88,101,242,.16);display:grid;place-items:center;margin:0 auto 18px;color:var(--blue)}
.badge svg{width:34px;height:34px}
h1{font-family:var(--font-minecraft);font-size:28px;letter-spacing:1px;text-align:center;margin:0 0 6px}
.server{text-align:center;font-size:20px;font-weight:600;margin-bottom:4px;word-break:break-word}
.inviter{text-align:center;color:var(--muted);font-size:14px;margin-bottom:20px}
.meta{display:flex;justify-content:center;gap:28px;padding:14px;background:var(--input);border:1px solid var(--border);border-radius:10px;margin-bottom:20px}
.meta div{text-align:center}
.meta span{display:block}
.meta .label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:3px}
.meta .value{font-size:14px;font-weight:600}
.status{padding:12px;border-radius:8px;font-size:13px;text-align:center;margin-bottom:16px;line-height:1.5}
.status.info{background:rgba(88,101,242,.1);border:1px solid rgba(88,101,242,.35);color:#aab3ff}
.status.success{background:rgba(35,165,89,.12);border:1px solid rgba(35,165,89,.4);color:#8ee6b1}
.status.error{background:rgba(218,55,60,.1);border:1px solid rgba(218,55,60,.35);color:#ff9a9d}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px 20px;border-radius:10px;border:0;font:inherit;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;margin-top:10px}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:hover{background:#4a54e0;text-decoration:none}
.btn.secondary{background:transparent;color:#fff;border:2px solid var(--border)}
.btn.secondary:hover{background:#35373c;text-decoration:none}
.btn.danger{background:var(--red);color:#fff}
.btn.danger:hover{background:#e84244}
.btn:disabled{opacity:.55;cursor:not-allowed}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="badge" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>
    </div>
    <h1 id="pageTitle">Join Server</h1>
    <div class="server" id="serverName">Loading invitation…</div>
    <div class="inviter" id="inviterText"></div>
    <div class="meta">
      <div><span class="label">Members</span><span class="value" id="memberCount">—</span></div>
      <div><span class="label">Expires</span><span class="value" id="expiresAt">—</span></div>
    </div>
    <div class="status info" id="statusMsg">Loading invitation…</div>
    <div id="actions" class="hidden">
      <button type="button" class="btn primary" id="acceptBtn">Accept Invitation</button>
      <button type="button" class="btn secondary" id="declineBtn">Decline</button>
    </div>
    <a class="btn primary hidden" id="openServerBtn" href="/app">Open Server</a>
    <a class="btn secondary hidden" id="backBtn" href="/app">Back to MINECORD</a>
  </div>
</div>
<script>
(function () {
  const code = new URL(location.href).searchParams.get('code') || location.pathname.split('/').filter(Boolean).pop() || '';
  const statusNode = document.getElementById('statusMsg');
  const acceptBtn = document.getElementById('acceptBtn');
  const declineBtn = document.getElementById('declineBtn');
  const openBtn = document.getElementById('openServerBtn');
  let serverId = '';

  function setStatus(message, kind) {
    statusNode.textContent = message;
    statusNode.className = 'status ' + (kind || 'info');
  }
  function showOpenServer(id, message) {
    serverId = id || serverId;
    openBtn.href = '/app?server=' + encodeURIComponent(serverId);
    openBtn.classList.remove('hidden');
    document.getElementById('backBtn').classList.remove('hidden');
    document.getElementById('actions').classList.add('hidden');
    if (message) setStatus(message, 'success');
    document.getElementById('pageTitle').textContent = 'Invitation Accepted';
  }
  function fail(message) {
    document.getElementById('serverName').textContent = 'Invitation unavailable';
    document.getElementById('inviterText').textContent = '';
    document.querySelector('.meta').classList.add('hidden');
    document.getElementById('actions').classList.add('hidden');
    document.getElementById('backBtn').classList.remove('hidden');
    setStatus(message, 'error');
  }

  fetch('/api/invite/preview?code=' + encodeURIComponent(code), { credentials: 'same-origin' })
    .then(async response => {
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body.error || 'This invitation is no longer valid.');
      return body;
    })
    .then(data => {
      serverId = data.server.id;
      document.getElementById('serverName').textContent = data.server.name;
      document.getElementById('memberCount').textContent = data.server.memberCount;
      document.getElementById('inviterText').textContent = data.inviter ? 'Invited by ' + (data.inviter.displayName || data.inviter.username) : '';
      document.getElementById('expiresAt').textContent = new Date(data.expiresAt).toLocaleDateString();
      if (data.alreadyMember) {
        showOpenServer(data.server.id, 'You are already a member of this server.');
        return;
      }
      if (data.targetMismatch) {
        document.getElementById('backBtn').classList.remove('hidden');
        setStatus('This invitation was sent to a different MINECORD account. Sign in with the account that was invited, or ask for a new invitation.', 'error');
        return;
      }
      setStatus(data.targeted ? 'This invitation was sent to your account. Accept to join the server.' : 'You are invited to join this server.', 'info');
      document.getElementById('actions').classList.remove('hidden');
      acceptBtn.disabled = false;
    })
    .catch(error => fail(error.message));

  acceptBtn.addEventListener('click', async () => {
    acceptBtn.disabled = true;
    acceptBtn.textContent = 'Joining…';
    try {
      const response = await fetch('/api/invite/accept', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code })
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body.error || 'The invitation could not be accepted.');
      showOpenServer(body.server?.id, body.alreadyMember ? 'You are already a member of this server.' : 'You joined the server. It is now available in your server list.');
    } catch (error) {
      acceptBtn.disabled = false;
      acceptBtn.textContent = 'Accept Invitation';
      setStatus(error.message, 'error');
    }
  });

  declineBtn.addEventListener('click', async () => {
    declineBtn.disabled = true;
    declineBtn.textContent = 'Declining…';
    try {
      await fetch('/api/invite/decline', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code })
      });
      document.getElementById('actions').classList.add('hidden');
      document.getElementById('backBtn').classList.remove('hidden');
      setStatus('Invitation declined. You can close this page.', 'info');
    } catch (error) {
      declineBtn.disabled = false;
      declineBtn.textContent = 'Decline';
      setStatus('The invitation could not be declined. You can ignore this page.', 'error');
    }
  });
})();
</script>
</body>
</html>
