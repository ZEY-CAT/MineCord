<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Server Invitation — MINECORD</title><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png"><link rel="icon" href="/icons/icon-512.png" sizes="512x512" type="image/png"><link rel="apple-touch-icon" href="/icons/icon-192.png"><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#5865f2"><style>
@font-face{font-family:'VT323';src:url('/fonts/vt323.ttf') format('truetype');font-style:normal;font-weight:400;font-display:swap;unicode-range:U+0020-007F,U+00A0-00FF}
@font-face{font-family:'IBM Plex Sans';src:url('/fonts/ibm-plex-sans-regular.ttf') format('truetype');font-style:normal;font-weight:400;font-display:swap}
@font-face{font-family:'IBM Plex Sans';src:url('/fonts/ibm-plex-sans-medium.ttf') format('truetype');font-style:normal;font-weight:500;font-display:swap}
@font-face{font-family:'IBM Plex Sans';src:url('/fonts/ibm-plex-sans-semibold.ttf') format('truetype');font-style:normal;font-weight:600;font-display:swap}
:root{--font-minecraft:'VT323',ui-monospace,"Cascadia Mono",Consolas,monospace;--font-ui:'IBM Plex Sans',system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#f2f4f7;background:#313338;font-size:16px;font-family:var(--font-ui);--side:#1e1f22;--rail:#111214;--hover:#35373c;--line:#202225;--muted:#b5bac1;--blue:#5865f2;--green:#23a559;--red:#da373c;--yellow:#faa61a;--panel:#1e1f22;--panel-border:#202225;--input-bg:#2a2c31;--input-border:#3e4147}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#313338;display:flex;align-items:center;justify-content:center;padding:24px}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}button{font:inherit;font-family:var(--font-ui)}.container{max-width:480px;width:100%}.card{background:var(--panel);border:1px solid var(--panel-border);border-radius:16px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,0.4)}.icon{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,rgba(88,101,242,0.2),rgba(35,165,89,0.15));display:grid;place-items:center;margin:0 auto 24px;color:var(--blue)}.icon svg{width:36px;height:36px}h1{font-family:var(--font-minecraft);font-size:28px;text-align:center;margin:0 0 8px;letter-spacing:1px}.server-name{text-align:center;font-size:18px;font-weight:600;margin-bottom:8px}.inviter{text-align:center;color:var(--muted);font-size:14px;margin-bottom:24px}.meta{display:flex;justify-content:center;gap:24px;margin-bottom:24px;padding:16px;background:var(--input-bg);border:1px solid var(--panel-border);border-radius:10px}.meta-item{display:flex;flex-direction:column;align-items:center;gap:4px}.meta-label{font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted)}.meta-value{font-size:14px;font-weight:500}.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 28px;border-radius:10px;font-weight:600;font-size:15px;cursor:pointer;transition:transform 0.1s ease,background 0.15s ease,box-shadow 0.15s ease;border:0;white-space:nowrap;width:100%}.btn:active{transform:scale(0.98)}.btn.primary{background:var(--blue);color:#fff;box-shadow:0 4px 20px rgba(88,101,242,0.3)}.btn.primary:hover{background:#4a54e0;box-shadow:0 6px 28px rgba(88,101,242,0.4)}.btn.secondary{background:transparent;color:var(--muted);border:2px solid var(--line)}.btn.secondary:hover{background:var(--hover);border-color:var(--blue);color:#fff}.btn:disabled{opacity:0.5;cursor:not-allowed}.btn-group{display:flex;flex-direction:column;gap:12px;margin-top:24px}.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--muted);font-size:13px}.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line)}.status{padding:12px;border-radius:8px;font-size:13px;text-align:center;margin-bottom:16px}.status.info{background:rgba(88,101,242,0.1);border:1px solid rgba(88,101,242,0.3);color:var(--blue)}.status.warning{background:rgba(250,166,26,0.1);border:1px solid rgba(250,166,26,0.3);color:var(--yellow)}.error{color:var(--red);text-align:center;font-size:13px;margin-top:16px;min-height:20px}@media(max-width:640px){.card{padding:24px}}
</style></head><body><div class="container"><div class="card"><div class="icon"><svg class="uiIcon" aria-hidden="true"><use href="#icon-server"></use></svg></div><h1>Server Invitation</h1><div class="server-name" id="serverName">Loading…</div><div class="inviter" id="inviterText">Invited by <span id="inviterName">someone</span></div><div class="meta"><div class="meta-item"><span class="meta-label">Members</span><span class="meta-value" id="memberCount">—</span></div><div class="meta-item"><span class="meta-label">Expires</span><span class="meta-value" id="expiresAt">—</span></div></div><div class="status info" id="statusMsg">You need to sign in to accept this invitation.</div><div class="btn-group"><a class="btn primary" id="signInBtn" href="/app?oauth=google">Continue with Google</a><a class="btn secondary" id="signInBtn2" href="/app?oauth=microsoft">Continue with Microsoft</a><a class="btn secondary" id="signInBtn3" href="/app?oauth=github">Continue with GitHub</a></div><div class="divider"><span>Or</span></div><a class="btn secondary" id="openAppBtn" href="/app">Open Web App</a><div class="error" id="errorMsg"></div></div></div><script>async function loadInvite(){try{const url=new URL(window.location.href);const code=url.searchParams.get('code')||url.pathname.split('/').pop();const res=await fetch('/api/invite/preview?code='+encodeURIComponent(code));if(!res.ok){const err=await res.json();throw new Error(err.error||'Failed to load invite')}}catch(e){document.getElementById('statusMsg').textContent='Failed to load invitation.';document.getElementById('statusMsg').className='status warning';document.getElementById('errorMsg').textContent=e.message;document.querySelectorAll('.btn').forEach(b=>b.style.display='none');return}const data=await res.json();document.getElementById('serverName').textContent=data.server.name;document.getElementById('memberCount').textContent=data.server.memberCount;document.getElementById('inviterName').textContent=data.inviter?.displayName||data.inviter?.username||'someone';const exp=new Date(data.expiresAt);document.getElementById('expiresAt').textContent=exp.toLocaleDateString()+' '+exp.toLocaleTimeString();const signInUrl='/app?invite='+encodeURIComponent(code);document.getElementById('signInBtn').href=signInUrl;document.getElementById('signInBtn2').href=signInUrl;document.getElementById('signInBtn3').href=signInUrl;document.getElementById('openAppBtn').href=signInUrl;}loadInvite();</script></body></html>
