<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MINECORD Eaglercraft</title>
  <link rel="stylesheet" href="options.css">
</head>
<body class="popup">
  <main class="settings popup">
    <header>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M10 13.5 14 9.5M8.5 15l-2 2a3.54 3.54 0 0 1-5-5l4-4a3.54 3.54 0 0 1 5 0m5-3 2-2a3.54 3.54 0 0 1 5 5l-4 4a3.54 3.54 0 0 1-5 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <div>
        <h1>MINECORD Eaglercraft</h1>
        <p>Private game activity sharing</p>
      </div>
    </header>
    <section aria-label="Pairing controls">
      <p class="description">Pair once. The connector shares only whether a supported Eaglercraft page is active.</p>
      <label for="server">MINECORD server URL</label>
      <input id="server" type="url" inputmode="url" autocomplete="url" spellcheck="false" placeholder="https://minecord-8vg2.onrender.com">
      <label for="code">One-time pairing code</label>
      <input id="code" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste code from MINECORD Settings">
      <div class="actions">
        <button id="pair" type="button">Pair connector</button>
        <button id="unpair" class="secondary" type="button" disabled>Unpair</button>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>
    <section class="privacy" aria-label="Privacy information">
      <p>Player names, server addresses, browser history, cookies, and other sites are never read.</p>
    </section>
    <a id="options" href="#">Open full settings</a>
  </main>
  <script src="popup.js"></script>
</body>
</html>
