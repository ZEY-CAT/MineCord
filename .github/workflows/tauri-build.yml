name: Tauri Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.1)'
        required: true
        type: string
      create_release:
        description: 'Create GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows-tauri:
    name: Windows (Tauri)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri Windows
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          MINECORD_UPDATER_PUBKEY: ${{ secrets.MINECORD_UPDATER_PUBKEY }}
          MINECORD_UPDATER_ENDPOINT: ${{ secrets.MINECORD_UPDATER_ENDPOINT }}
        run: npm run tauri:build

      - name: Upload Windows Tauri artifact
        uses: actions/upload-artifact@v4
        with:
          name: mincord-windows-tauri
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7

  windows-electron:
    name: Windows (Electron)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Electron Windows
        run: npm run build:desktop

      - name: Upload Windows Electron artifact
        uses: actions/upload-artifact@v4
        with:
          name: mincord-windows-electron
          path: dist/*.exe
          retention-days: 7

  macos:
    name: macOS (Tauri)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Import Apple certificates
        if: ${{ env.APPLE_CERT_P12_BASE64 != '' && env.APPLE_CERT_PASSWORD != '' }}
        run: |
          echo "$APPLE_CERT_P12_BASE64" | base64 -d > cert.p12
          security import cert.p12 -k ~/Library/Keychains/login.keychain-db -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$APPLE_CERT_PASSWORD" ~/Library/Keychains/login.keychain-db

      - name: Build Tauri macOS
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          MINECORD_UPDATER_PUBKEY: ${{ secrets.MINECORD_UPDATER_PUBKEY }}
          MINECORD_UPDATER_ENDPOINT: ${{ secrets.MINECORD_UPDATER_ENDPOINT }}
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: npm run tauri:build -- --bundles dmg,app

      - name: Notarize macOS artifacts
        if: ${{ env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != '' }}
        run: |
          for f in src-tauri/target/release/bundle/dmg/*.dmg; do
            if [ -f "$f" ]; then
              xcrun notarytool submit "$f" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
              xcrun stapler staple "$f"
            fi
          done
          for f in src-tauri/target/release/bundle/macos/*.app; do
            if [ -d "$f" ]; then
              xcrun notarytool submit "$f" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
              xcrun stapler staple "$f"
            fi
          done

      - name: Package macOS app bundle
        if: ${{ always() }}
        run: |
          if [ -d "src-tauri/target/release/bundle/macos" ]; then
            cd src-tauri/target/release/bundle/macos
            for app in *.app; do
              if [ -d "$app" ]; then
                zip -r "${app}.zip" "$app"
              fi
            done
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mincord-macos
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/macos/*.zip
          retention-days: 7

  linux:
    name: Linux (Tauri)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            fakeroot

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri Linux
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          MINECORD_UPDATER_PUBKEY: ${{ secrets.MINECORD_UPDATER_PUBKEY }}
          MINECORD_UPDATER_ENDPOINT: ${{ secrets.MINECORD_UPDATER_ENDPOINT }}
        run: npm run tauri:build -- --bundles appimage,deb,rpm

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mincord-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          retention-days: 7

  android:
    name: Android (Tauri)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r27c
          emulator: false
          cache-key: android-sdk-${{ runner.os }}-${{ hashFiles('src-tauri/gen/android/**') }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Android APK
        env:
          MINECORD_ANDROID_KEYSTORE_PATH: ${{ secrets.MINECORD_ANDROID_KEYSTORE_PATH }}
          MINECORD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MINECORD_ANDROID_KEYSTORE_PASSWORD }}
          MINECORD_ANDROID_KEY_ALIAS: ${{ secrets.MINECORD_ANDROID_KEY_ALIAS }}
          MINECORD_ANDROID_KEY_PASSWORD: ${{ secrets.MINECORD_ANDROID_KEY_PASSWORD }}
        run: |
          cd src-tauri/gen/android
          ./gradlew assembleRelease
          cd ../..

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: mincord-android
          path: src-tauri/gen/android/app/build/outputs/apk/release/*.apk
          retention-days: 7

  release:
    name: Create Release
    needs: [windows-tauri, windows-electron, macos, linux, android]
    if: github.event.inputs.create_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          find artifacts -type f -name "*.exe" -o -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" -o -name "*.apk" | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: MINECORD v${{ github.event.inputs.version }}
          draft: false
          prerelease: false
          files: |
            artifacts/mincord-windows-tauri/*.exe
            artifacts/mincord-windows-electron/*.exe
            artifacts/mincord-macos/*.dmg
            artifacts/mincord-macos/*.zip
            artifacts/mincord-linux/*.AppImage
            artifacts/mincord-linux/*.deb
            artifacts/mincord-linux/*.rpm
            artifacts/mincord-android/*.apk
          body: |
            ## MINECORD v${{ github.event.inputs.version }}

            ### Windows
            - **Tauri (NSIS)**: `MINECORD_${{ github.event.inputs.version }}_x64-setup.exe` — Lightweight WebView2-based installer (~3 MB)
            - **Electron (NSIS)**: `MINECORD Setup ${{ github.event.inputs.version }}.exe` — Full Electron bundle (~120 MB)

            ### macOS
            - **DMG**: `MINECORD_${{ github.event.inputs.version }}_x64.dmg` / `MINECORD_${{ github.event.inputs.version }}_arm64.dmg`
            - **App Bundle**: `MINECORD.app.zip` (unsigned if no Apple credentials)

            ### Linux
            - **AppImage**: `MINECORD_${{ github.event.inputs.version }}_amd64.AppImage`
            - **DEB**: `MINECORD_${{ github.event.inputs.version }}_amd64.deb`
            - **RPM**: `MINECORD_${{ github.event.inputs.version }}_amd64.rpm`

            ### Android
            - **APK**: `app-release.apk` (signed if keystore provided, otherwise unsigned validation build)

            ### Notes
            - Tauri builds use the MINECORD updater with minisign signature verification
            - Electron builds use electron-updater with GitHub Releases
            - All Tauri artifacts are signed with minisign (public key embedded in app)
            - Android APK is signed with release keystore if provided; unsigned otherwise
            - macOS artifacts are signed/notarized only if Apple Developer credentials are provided

            ### Installation
            - **Windows**: Run the `.exe` installer
            - **macOS**: Open the `.dmg` and drag `MINECORD.app` to Applications, or unzip `.zip` and copy
            - **Linux**: Run the `.AppImage` (make executable first), or install `.deb`/`.rpm` via package manager
            - **Android**: Enable "Install from unknown sources" and open the `.apk`

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}