name: Tauri Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.1)'
        required: true
        type: string
      create_release:
        description: 'Create GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows-tauri:
    name: Windows (Tauri)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: npm ci

      - name: Generate edition config (Tauri Lite)
        run: node scripts/generate-edition.js tauri-lite

      - name: Build frontend
        run: npm run build

      - name: Build Tauri Windows
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          MINECORD_UPDATER_PUBKEY: ${{ secrets.MINECORD_UPDATER_PUBKEY }}
          MINECORD_UPDATER_ENDPOINT: ${{ secrets.MINECORD_UPDATER_ENDPOINT }}
        run: npm run tauri:build

      - name: Verify Windows Tauri artifacts exist
        run: |
          echo "Checking for NSIS installer..."
          Get-ChildItem -Recurse -Path src-tauri/target -Filter "*.exe" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*bundle*nsis*" }
          $msiCount = (Get-ChildItem -Recurse -Path src-tauri/target -Filter "*.msi" -ErrorAction SilentlyContinue | Measure-Object).Count
          if ($msiCount -gt 0) {
            echo "MSI installer also found"
          }
          $nsisCount = (Get-ChildItem -Recurse -Path src-tauri/target -Filter "*.exe" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*bundle*nsis*" } | Measure-Object).Count
          if ($nsisCount -eq 0) {
            Write-Error "ERROR: No NSIS installer found!"
            exit 1
          }
        shell: pwsh

      - name: Package Tauri Lite Edition ZIP
        run: |
          Write-Host "=== Creating Tauri Lite Edition ZIP ==="
          $version = "${{ github.event.inputs.version || '1.0.2' }}"
          $zipName = "MineCord-Tauri-Lite-v${version}-Windows-x64.zip"
          $zipPath = "dist/${zipName}"
          
          # Create dist directory
          if (-not (Test-Path "dist")) {
            New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          }
          
          # Find the NSIS installer
          $nsisInstaller = Get-ChildItem -Recurse -Path src-tauri/target -Filter "*.exe" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*bundle*nsis*" } | Select-Object -First 1
          
          if (-not $nsisInstaller) {
            Write-Error "Tauri NSIS installer not found"
            exit 1
          }
          
          Write-Host "Found Tauri installer: $($nsisInstaller.FullName)"
          
          # Use 7zip to extract NSIS installer
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) {
            $sevenZip = "C:\Program Files (x86)\7-Zip\7z.exe"
          }
          
          if (-not (Test-Path $sevenZip)) {
            Write-Error "7-Zip not found. Cannot extract NSIS installer."
            exit 1
          }
          
          $tempDir = Join-Path $env:TEMP "MineCordTauriLite_${version}"
          if (Test-Path $tempDir) { Remove-Item $tempDir -Recurse -Force }
          New-Item -ItemType Directory -Path $tempDir -Force | Out-Null
          
          Write-Host "Extracting Tauri installer to create ZIP..."
          & $sevenZip x $nsisInstaller.FullName -o$tempDir -y | Out-Null
          
          # Find the app directory in extracted files
          $appDir = Get-ChildItem -Recurse -Path $tempDir -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -like "*MineCord*" -or $_.Name -eq "app" -or $_.Name -eq "MINECORD" } | Select-Object -First 1
          
          if (-not $appDir) {
            $exeFile = Get-ChildItem -Recurse -Path $tempDir -Filter "MINECORD.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($exeFile) {
              $appDir = $exeFile.Directory
            }
          }
          
          if (-not $appDir) {
            Write-Error "Could not find Tauri app directory in extracted installer"
            exit 1
          }
          
          Write-Host "Found app directory: $($appDir.FullName)"
          
          # Verify no DLL
          $dllPath = Join-Path $appDir.FullName "MineCordUpdater.dll"
          if (Test-Path $dllPath) {
            Write-Error "ERROR: MineCordUpdater.dll found in Tauri output - should not be bundled!"
            exit 1
          }
          Write-Host "OK: MineCordUpdater.dll NOT bundled in Tauri package"
          
          # Create README
          $readme = @"
MINECORD TAURI LITE EDITION v${version}
========================================

Lightweight Tauri/WebView2 edition with core chat features. Excludes voice, shop, admin tools, and advanced account management.

INSTALLATION
============

1. FIRST: Install the shared updater (required for automatic updates)
   Download and run: MineCordUpdaterSetup.exe
   This installs MineCordUpdater.dll to %ProgramFiles%\MineCord\

2. LAUNCH THE APPLICATION
   Extract this ZIP to a folder of your choice.
   Run MINECORD.exe to start the application.

REQUIREMENTS
============

- Windows 10/11 (x64)
- WebView2 Runtime (included with Windows 11, auto-installed on Windows 10)
- .NET Framework not required

SHARED UPDATER
==============

Both MineCord editions share a single native updater DLL installed at:
  %ProgramFiles%\MineCord\MineCordUpdater.dll

The MineCordUpdaterSetup.exe installer (downloaded separately) handles
installation with proper UAC elevation and safe upgrade handling.

If the updater DLL is missing, the application will show a helpful
error message with a link to download the installer.

FEATURES INCLUDED
=================
- Lightweight Tauri/WebView2 application (~10 MB)
- Accounts, profiles & authentication
- Friends, DMs, servers & channels
- Text chat with full history
- Minecraft Java/Bedrock account linking
- Game activity display (Minecraft, Eaglercraft)
- Desktop notifications & push notifications
- Lightweight WebView2-based (~10 MB vs ~120 MB)

FEATURES EXCLUDED (Lite Edition Only)
=====================================
- Voice calling (private & group calls)
- WebRTC voice with TURN relay
- Shop, cosmetics, inventory & onboarding
- Account merging with archive preservation
- Admin/owner tools (role management, audit logs)
- Eaglercraft browser extension integration
- Full settings & customization
- Account merging with deduplication

SUPPORT
=======

GitHub: https://github.com/ZEY-CAT/MineCord
Issues: https://github.com/ZEY-CAT/MineCord/issues

LICENSE
=======

MIT License - See LICENSE file for details.
"@
          
          $readmePath = Join-Path $appDir.FullName "README.txt"
          Set-Content -Path $readmePath -Value $readme -Encoding UTF8
          Write-Host "Created README.txt"
          
          # Create ZIP
          Write-Host "Creating ZIP: ${zipName}"
          Compress-Archive -Path (Join-Path $appDir.FullName "*") -DestinationPath "dist/${zipName}" -Force
          
          # Cleanup
          Remove-Item $tempDir -Recurse -Force -ErrorAction SilentlyContinue
          
          $zipSize = (Get-Item "dist/${zipName}").Length
          Write-Host "Created: dist/${zipName} ($([math]::Round($zipSize/1MB, 1)) MB)"
        shell: pwsh

      - name: Verify Tauri ZIP (no DLL)
        run: |
          $version = "${{ github.event.inputs.version || '1.0.2' }}"
          $zipPath = "dist/MineCord-Tauri-Lite-v${version}-Windows-x64.zip"
          $tempDir = Join-Path $env:TEMP "verify_tauri_$([guid]::NewGuid())"
          New-Item -ItemType Directory -Path $tempDir -Force | Out-Null
          try {
            $sevenZip = "C:\Program Files\7-Zip\7z.exe"
            if (-not (Test-Path $sevenZip)) { $sevenZip = "C:\Program Files (x86)\7-Zip\7z.exe" }
            & $sevenZip x $zipPath -o$tempDir -y | Out-Null
            $dllInZip = Get-ChildItem -Recurse -Path $tempDir -Filter "MineCordUpdater.dll" -ErrorAction SilentlyContinue
            if ($dllInZip) {
              Write-Error "FAIL: MineCordUpdater.dll found in Tauri ZIP"
            } else {
              Write-Host "OK: No MineCordUpdater.dll in Tauri ZIP"
            }
          } finally {
            Remove-Item $tempDir -Recurse -Force -ErrorAction SilentlyContinue
          }
        shell: pwsh

      - name: Upload Windows Tauri artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mincord-windows-tauri
          path: |
            src-tauri/target/**/bundle/nsis/*.exe
            dist/MineCord-Tauri-Lite-v*.zip
          retention-days: 7
          if-no-files-found: error

  macos:
    name: macOS (Tauri)
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Import Apple certificates
        if: ${{ env.APPLE_CERT_P12_BASE64 != '' && env.APPLE_CERT_PASSWORD != '' }}
        run: |
          echo "$APPLE_CERT_P12_BASE64" | base64 -d > cert.p12
          security import cert.p12 -k ~/Library/Keychains/login.keychain-db -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$APPLE_CERT_PASSWORD" ~/Library/Keychains/login.keychain-db

      - name: Build Tauri macOS
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          MINECORD_UPDATER_PUBKEY: ${{ secrets.MINECORD_UPDATER_PUBKEY }}
          MINECORD_UPDATER_ENDPOINT: ${{ secrets.MINECORD_UPDATER_ENDPOINT }}
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: npm run tauri:build

      - name: Verify macOS DMG exists
        run: |
          set -e
          echo "Checking for DMG files..."
          find src-tauri/target -name "*.dmg" -type f | head -5
          DMG_COUNT=$(find src-tauri/target -name "*.dmg" -type f | wc -l)
          if [ "$DMG_COUNT" -eq 0 ]; then
            echo "ERROR: No DMG files found!"
            exit 1
          fi
          echo "Found $DMG_COUNT DMG file(s)"

      - name: Verify macOS App bundle exists
        run: |
          set -e
          echo "Checking for .app bundles..."
          find src-tauri/target -name "*.app" -type d | head -5
          APP_COUNT=$(find src-tauri/target -name "*.app" -type d | wc -l)
          if [ "$APP_COUNT" -eq 0 ]; then
            echo "ERROR: No .app bundles found!"
            exit 1
          fi
          echo "Found $APP_COUNT .app bundle(s)"

      - name: Notarize macOS artifacts
        if: ${{ env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != '' }}
        run: |
          for f in src-tauri/target/release/bundle/dmg/*.dmg; do
            if [ -f "$f" ]; then
              xcrun notarytool submit "$f" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
              xcrun stapler staple "$f"
            fi
          done
          for f in src-tauri/target/release/bundle/macos/*.app; do
            if [ -d "$f" ]; then
              xcrun notarytool submit "$f" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
              xcrun stapler staple "$f"
            fi
          done

      - name: Package macOS app bundle
        if: ${{ always() }}
        run: |
          set -e
          if [ -d "src-tauri/target/release/bundle/macos" ]; then
            cd src-tauri/target/release/bundle/macos
            for app in *.app; do
              if [ -d "$app" ]; then
                echo "Packaging $app..."
                zip -r "${app}.zip" "$app"
                tar -czf "${app}.tar.gz" "$app"
              fi
            done
          fi

      - name: Rename macOS artifacts for release
        if: ${{ always() }}
        run: |
          set -e
          # Rename DMG files to include architecture
          for f in src-tauri/target/**/bundle/dmg/*.dmg; do
            if [ -f "$f" ]; then
              if [[ "$f" == *"aarch64"* ]] || [[ "$f" == *"arm64"* ]]; then
                mv "$f" "$(dirname "$f")/MineCord-macOS-AppleSilicon.dmg"
              else
                mv "$f" "$(dirname "$f")/MineCord-macOS-Intel.dmg"
              fi
            fi
          done
          # Rename app bundles
          if [ -d "src-tauri/target/release/bundle/macos" ]; then
            cd src-tauri/target/release/bundle/macos
            for app in *.app; do
              if [ -d "$app" ]; then
                arch=$(echo "$app" | grep -oE '(aarch64|arm64|x86_64)' || echo 'x64')
                if [[ "$arch" == "aarch64" ]] || [[ "$arch" == "arm64" ]]; then
                  mv "$app" "MineCord-AppleSilicon.app"
                  mv "${app}.zip" "MineCord-AppleSilicon.app.zip" 2>/dev/null || true
                  mv "${app}.tar.gz" "MineCord-AppleSilicon.app.tar.gz" 2>/dev/null || true
                else
                  mv "$app" "MineCord-Intel.app"
                  mv "${app}.zip" "MineCord-Intel.app.zip" 2>/dev/null || true
                  mv "${app}.tar.gz" "MineCord-Intel.app.tar.gz" 2>/dev/null || true
                fi
              fi
            done
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mincord-macos
          path: |
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.zip
            src-tauri/target/release/bundle/macos/*.tar.gz
          retention-days: 7
          if-no-files-found: error

  linux:
    name: Linux (Tauri)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            fakeroot

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri Linux
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          MINECORD_UPDATER_PUBKEY: ${{ secrets.MINECORD_UPDATER_PUBKEY }}
          MINECORD_UPDATER_ENDPOINT: ${{ secrets.MINECORD_UPDATER_ENDPOINT }}
        run: npm run tauri:build

      - name: Verify Linux artifacts exist
        run: |
          set -e
          echo "Checking for AppImage files..."
          find src-tauri/target -name "*.AppImage" -type f | head -5
          APPIMAGE_COUNT=$(find src-tauri/target -name "*.AppImage" -type f | wc -l)
          if [ "$APPIMAGE_COUNT" -eq 0 ]; then
            echo "ERROR: No AppImage files found!"
            exit 1
          fi
          echo "Found $APPIMAGE_COUNT AppImage file(s)"
          echo "Checking for DEB files..."
          find src-tauri/target -name "*.deb" -type f | head -5
          echo "Checking for RPM files..."
          find src-tauri/target -name "*.rpm" -type f | head -5

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mincord-linux
          path: |
            src-tauri/target/**/bundle/appimage/*.AppImage
            src-tauri/target/**/bundle/deb/*.deb
            src-tauri/target/**/bundle/rpm/*.rpm
          retention-days: 7
          if-no-files-found: error

  android:
    name: Android (Tauri)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          api-level: 34
          ndk-version: r27c
          emulator: false
          cmdline-tools-version: latest
          cache-key: android-sdk-${{ runner.os }}-${{ hashFiles('src-tauri/gen/android/**') }}

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Android APK
        env:
          MINECORD_ANDROID_KEYSTORE_PATH: ${{ secrets.MINECORD_ANDROID_KEYSTORE_PATH }}
          MINECORD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MINECORD_ANDROID_KEYSTORE_PASSWORD }}
          MINECORD_ANDROID_KEY_ALIAS: ${{ secrets.MINECORD_ANDROID_KEY_ALIAS }}
          MINECORD_ANDROID_KEY_PASSWORD: ${{ secrets.MINECORD_ANDROID_KEY_PASSWORD }}
        run: |
          cd src-tauri/gen/android
          bash ./gradlew assembleRelease
          cd ../..

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: mincord-android
          path: src-tauri/gen/android/app/build/outputs/apk/release/*.apk
          retention-days: 7