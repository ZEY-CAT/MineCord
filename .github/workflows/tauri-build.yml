name: Tauri Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.1)'
        required: true
        type: string
      create_release:
        description: 'Create GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows-tauri:
    name: Windows (Tauri)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: npm ci

      - name: Generate edition config (Tauri Lite)
        run: node scripts/generate-edition.js tauri-lite

      - name: Build frontend
        run: npm run build

      - name: Build Tauri Windows
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          MINECORD_UPDATER_PUBKEY: ${{ secrets.MINECORD_UPDATER_PUBKEY }}
          MINECORD_UPDATER_ENDPOINT: ${{ secrets.MINECORD_UPDATER_ENDPOINT }}
        run: npm run tauri:build

      - name: Verify Windows Tauri artifacts exist
        run: |
          echo "Checking for NSIS installer..."
          Get-ChildItem -Recurse -Path src-tauri/target -Filter "*.exe" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*bundle*nsis*" }
          $msiCount = (Get-ChildItem -Recurse -Path src-tauri/target -Filter "*.msi" -ErrorAction SilentlyContinue | Measure-Object).Count
          if ($msiCount -gt 0) {
            echo "MSI installer also found"
          }
          $nsisCount = (Get-ChildItem -Recurse -Path src-tauri/target -Filter "*.exe" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*bundle*nsis*" } | Measure-Object).Count
          if ($nsisCount -eq 0) {
            Write-Error "ERROR: No NSIS installer found!"
            exit 1
          }
        shell: pwsh

      - name: Package Tauri Lite Edition ZIP
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\package-tauri-zip.ps1 -Version "${{ github.event.inputs.version || '1.0.2' }}"


      - name: Verify Tauri ZIP (no DLL)
        run: |
          $version = "${{ github.event.inputs.version || '1.0.2' }}"
          $zipPath = "dist/MineCord-Tauri-Lite-v${version}-Windows-x64.zip"
          $tempDir = Join-Path $env:TEMP "verify_tauri_$([guid]::NewGuid())"
          New-Item -ItemType Directory -Path $tempDir -Force | Out-Null
          try {
            $sevenZip = "C:\Program Files\7-Zip\7z.exe"
            if (-not (Test-Path $sevenZip)) { $sevenZip = "C:\Program Files (x86)\7-Zip\7z.exe" }
            & $sevenZip x $zipPath -o$tempDir -y | Out-Null
            $dllInZip = Get-ChildItem -Recurse -Path $tempDir -Filter "MineCordUpdater.dll" -ErrorAction SilentlyContinue
            if ($dllInZip) {
              Write-Error "FAIL: MineCordUpdater.dll found in Tauri ZIP"
            } else {
              Write-Host "OK: No MineCordUpdater.dll in Tauri ZIP"
            }
          } finally {
            Remove-Item $tempDir -Recurse -Force -ErrorAction SilentlyContinue
          }
        shell: pwsh

      - name: Upload Windows Tauri artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mincord-windows-tauri
          path: |
            src-tauri/target/**/bundle/nsis/*.exe
            dist/MineCord-Tauri-Lite-v*.zip
          retention-days: 7
          if-no-files-found: error

  macos:
    name: macOS (Tauri)
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    env:
      APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Generate edition config (Tauri Lite)
        run: node scripts/generate-edition.js tauri-lite

      - name: Build frontend
        run: npm run build

      - name: Import Apple certificates
        if: ${{ env.APPLE_CERT_P12_BASE64 != '' && env.APPLE_CERT_PASSWORD != '' }}
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          echo "$APPLE_CERT_P12_BASE64" | base64 -d > cert.p12
          security import cert.p12 -k ~/Library/Keychains/login.keychain-db -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$APPLE_CERT_PASSWORD" ~/Library/Keychains/login.keychain-db

      - name: Build Tauri macOS
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          MINECORD_UPDATER_PUBKEY: ${{ secrets.MINECORD_UPDATER_PUBKEY }}
          MINECORD_UPDATER_ENDPOINT: ${{ secrets.MINECORD_UPDATER_ENDPOINT }}
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: npm run tauri:build -- --target ${{ matrix.target }}

      - name: Verify macOS DMG exists
        run: |
          set -e
          echo "Checking for DMG files..."
          find src-tauri/target -name "*.dmg" -type f | head -5
          DMG_COUNT=$(find src-tauri/target -name "*.dmg" -type f | wc -l)
          if [ "$DMG_COUNT" -eq 0 ]; then
            echo "ERROR: No DMG files found!"
            exit 1
          fi
          echo "Found $DMG_COUNT DMG file(s)"

      - name: Verify macOS App bundle exists
        run: |
          set -e
          echo "Checking for .app bundles..."
          find src-tauri/target -name "*.app" -type d | head -5
          APP_COUNT=$(find src-tauri/target -name "*.app" -type d | wc -l)
          if [ "$APP_COUNT" -eq 0 ]; then
            echo "ERROR: No .app bundles found!"
            exit 1
          fi
          echo "Found $APP_COUNT .app bundle(s)"

      - name: Notarize macOS artifacts
        if: ${{ env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          shopt -s globstar
          for f in src-tauri/target/**/release/bundle/dmg/*.dmg; do
            if [ -f "$f" ]; then
              xcrun notarytool submit "$f" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
              xcrun stapler staple "$f"
            fi
          done
          for f in src-tauri/target/**/release/bundle/macos/*.app; do
            if [ -d "$f" ]; then
              ditto -c -k --keepParent "$f" "${f}.zip"
              xcrun notarytool submit "${f}.zip" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
              xcrun stapler staple "$f"
            fi
          done

      - name: Package macOS app bundle
        if: ${{ always() }}
        run: |
          set -e
          for app in src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app; do
            if [ -d "$app" ]; then
              echo "Packaging $app..."
              dir=$(dirname "$app")
              base=$(basename "$app")
              (cd "$dir" && zip -ry "${base}.zip" "$base" && tar -czf "${base}.tar.gz" "$base")
            fi
          done

      - name: Rename macOS artifacts for release
        if: ${{ always() }}
        run: |
          set -e
          if [[ "${{ matrix.target }}" == aarch64* ]]; then
            target="MineCord-AppleSilicon"
          else
            target="MineCord-Intel"
          fi
          for f in src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg; do
            if [ -f "$f" ]; then
              mv "$f" "$(dirname "$f")/$target.dmg"
            fi
          done
          for app in src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app; do
            if [ -d "$app" ]; then
              dir=$(dirname "$app")
              base=$(basename "$app")
              mv "$app" "$dir/$target.app"
              [ -f "$dir/${base}.zip" ] && mv "$dir/${base}.zip" "$dir/$target.app.zip"
              [ -f "$dir/${base}.tar.gz" ] && mv "$dir/${base}.tar.gz" "$dir/$target.app.tar.gz"
            fi
          done

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mincord-macos-${{ matrix.target }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.zip
            src-tauri/target/**/release/bundle/macos/*.tar.gz
          retention-days: 7
          if-no-files-found: error

  linux:
    name: Linux (Tauri)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            fakeroot

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: npm ci

      - name: Generate edition config (Tauri Lite)
        run: node scripts/generate-edition.js tauri-lite

      - name: Build frontend
        run: npm run build

      - name: Build Tauri Linux
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          MINECORD_UPDATER_PUBKEY: ${{ secrets.MINECORD_UPDATER_PUBKEY }}
          MINECORD_UPDATER_ENDPOINT: ${{ secrets.MINECORD_UPDATER_ENDPOINT }}
        run: npm run tauri:build

      - name: Verify Linux artifacts exist
        run: |
          set -e
          echo "Checking for AppImage files..."
          find src-tauri/target -name "*.AppImage" -type f | head -5
          APPIMAGE_COUNT=$(find src-tauri/target -name "*.AppImage" -type f | wc -l)
          if [ "$APPIMAGE_COUNT" -eq 0 ]; then
            echo "ERROR: No AppImage files found!"
            exit 1
          fi
          echo "Found $APPIMAGE_COUNT AppImage file(s)"
          echo "Checking for DEB files..."
          find src-tauri/target -name "*.deb" -type f | head -5
          echo "Checking for RPM files..."
          find src-tauri/target -name "*.rpm" -type f | head -5

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mincord-linux
          path: |
            src-tauri/target/**/bundle/appimage/*.AppImage
            src-tauri/target/**/bundle/deb/*.deb
            src-tauri/target/**/bundle/rpm/*.rpm
          retention-days: 7
          if-no-files-found: error

  android:
    name: Android (Tauri)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: latest

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: npm ci

      - name: Generate edition config (Tauri Lite)
        run: node scripts/generate-edition.js tauri-lite

      - name: Build frontend
        run: npm run build

      - name: Initialize Android project
        run: |
          rm -rf src-tauri/gen/android
          npm run tauri -- android init --ci

      - name: Build Android APK
        run: npm run tauri -- android build --apk --ci

      - name: Verify Android APK
        run: |
          set -e
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -type f | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK produced"
            exit 1
          fi
          SIZE=$(stat -c%s "$APK")
          echo "APK: $APK ($SIZE bytes)"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "ERROR: APK is unexpectedly small"
            exit 1
          fi
          cp "$APK" MineCord-Android.apk
          ls -l MineCord-Android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: mincord-android
          path: MineCord-Android.apk
          retention-days: 7
          if-no-files-found: error

  web:
    name: Web (build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

      - name: Generate edition config (Web / Electron)
        run: node scripts/generate-edition.js electron

      - name: Build web frontend
        run: npm run build

      - name: Verify web build
        run: |
          set -e
          for file in dist/web/index.html dist/web/landing.html dist/web/download.html dist/web/features.js; do
            if [ ! -s "$file" ]; then
              echo "ERROR: missing or empty $file"
              exit 1
            fi
            echo "$file: $(stat -c%s "$file") bytes"
          done

      - name: Package web build
        run: |
          set -e
          cd dist
          zip -r MineCord-Web.zip web
          ls -l MineCord-Web.zip

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: mincord-web
          path: dist/MineCord-Web.zip
          retention-days: 7
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [windows-tauri, macos, linux, android, web]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: find release-assets -type f -printf '%s %p\n' | sort -n

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: MINECORD v${{ inputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            release-assets/**/*.exe
            release-assets/**/*.msi
            release-assets/**/*.zip
            release-assets/**/*.dmg
            release-assets/**/*.tar.gz
            release-assets/**/*.AppImage
            release-assets/**/*.deb
            release-assets/**/*.rpm
            release-assets/**/*.apk
