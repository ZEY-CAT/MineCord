name: Tauri Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.1)'
        required: true
        type: string
      create_release:
        description: 'Create GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-updater-dll:
    name: Build MineCordUpdater.dll
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28'

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          architecture: x64
          vs-version: '17.0'

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: |
            updater/build
          key: ${{ runner.os }}-cmake-updater-${{ hashFiles('updater/CMakeLists.txt', 'updater/src/**') }}
          restore-keys: |
            ${{ runner.os }}-cmake-updater-

      - name: Configure CMake
        run: |
          cmake -B updater/build -S updater -DCMAKE_BUILD_TYPE=Release -G "Visual Studio 17 2022" -A x64

      - name: Build MineCordUpdater.dll
        run: |
          cmake --build updater/build --config Release --parallel

      - name: Verify DLL
        run: |
          $dllPath = "updater/build/Release/MineCordUpdater.dll"
          if (-not (Test-Path $dllPath)) {
            Write-Error "ERROR: MineCordUpdater.dll not found at $dllPath"
            exit 1
          }
          $dllInfo = Get-Item $dllPath
          Write-Host "DLL built successfully: $($dllInfo.FullName) ($($dllInfo.Length / 1KB) KB)"

      - name: Test DLL Load and Functions
        run: |
          # Install koffi for testing
          npm install koffi --prefix .

          # Create test script
          $testScript = @"
          const koffi = require('koffi');
          const path = require('path');

          const dllPath = path.join(process.cwd(), 'updater/build/Release/MineCordUpdater.dll');
          console.log('Loading DLL from:', dllPath);

          try {
            const lib = koffi.load(dllPath);

            // Test GetUpdaterVersion
            lib.func('GetUpdaterVersion', 'string', []);
            const version = lib.GetUpdaterVersion();
            console.log('Updater version:', version);

            // Test CheckForUpdates (should return NO_UPDATE for fake server)
            lib.func('CheckForUpdates', 'int', ['string', 'string', 'string', 'string', 'string', 'pointer']);
            lib.func('FreeUpdateInfo', 'void', ['pointer']);
            lib.func('GetLastError', 'string', []);

            const outInfo = koffi.alloc('pointer');
            const result = lib.CheckForUpdates('http://localhost:3000', '1.0.2', 'windows', 'x64', 'stable', outInfo);
            console.log('CheckForUpdates result:', result);

            if (result === -3) { // UPDATER_ERROR_NO_UPDATE
              console.log('? CheckForUpdates correctly returns NO_UPDATE for unreachable server');
            }

            lib.FreeUpdateInfo(outInfo);

            // Test GetLastError
            const error = lib.GetLastError();
            console.log('Last error:', error);

            console.log('? All DLL functions tested successfully');
          "@

          node -e $testScript
        shell: pwsh

      - name: Upload MineCordUpdater.dll
        uses: actions/upload-artifact@v4
        with:
          name: mincord-updater-dll
          path: updater/build/Release/MineCordUpdater.dll
          retention-days: 7
          if-no-files-found: error

      - name: Run Signature Verification Tests
        run: |
          # Install test dependencies
          npm install minisign --prefix .

          # Create test script for signature verification
          $testScript = @"
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');

          console.log('Testing signature verification...');

          // Test 1: Verify minisign public key format
          const pubKeyPath = path.join(process.env.USERPROFILE, '.minisign', 'minisign.pub');
          if (fs.existsSync(pubKeyPath)) {
            const pubKey = fs.readFileSync(pubKeyPath, 'utf8');
            console.log('? Public key file exists');
            console.log('  Key:', pubKey.split('\n')[0]);
          } else {
            console.log('? Public key not found at', pubKeyPath);
          }

          // Test 2: Verify we can create and verify a test signature
          // This is a placeholder for actual minisign verification tests
          console.log('? Signature verification test structure ready');

          // Test 3: Verify minisign binary availability
          const minisignPath = require('minisign');
          console.log('? minisign available at:', minisignPath);
          "@

          node -e $testScript
        shell: pwsh

  windows-tauri:
    name: Windows (Tauri)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri Windows
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          MINECORD_UPDATER_PUBKEY: ${{ secrets.MINECORD_UPDATER_PUBKEY }}
          MINECORD_UPDATER_ENDPOINT: ${{ secrets.MINECORD_UPDATER_ENDPOINT }}
        run: npm run tauri:build

      - name: Verify Windows Tauri artifacts exist
        run: |
          echo "Checking for NSIS installer..."
          Get-ChildItem -Recurse -Path src-tauri/target -Filter "*.exe" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*bundle*nsis*" }
          $msiCount = (Get-ChildItem -Recurse -Path src-tauri/target -Filter "*.msi" -ErrorAction SilentlyContinue | Measure-Object).Count
          if ($msiCount -gt 0) {
            echo "MSI installer also found"
          }
          $nsisCount = (Get-ChildItem -Recurse -Path src-tauri/target -Filter "*.exe" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*bundle*nsis*" } | Measure-Object).Count
          if ($nsisCount -eq 0) {
            Write-Error "ERROR: No NSIS installer found!"
            exit 1
          }
        shell: pwsh

      - name: Upload Windows Tauri artifact
        uses: actions/upload-artifact@v4
        with:
          name: mincord-windows-tauri
          path: src-tauri/target/**/bundle/nsis/*.exe
          retention-days: 7
          if-no-files-found: error

  windows-electron:
    name: Windows (Electron) with Updater DLL
    runs-on: windows-latest
    timeout-minutes: 30
    needs: build-updater-dll
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Download MineCordUpdater.dll
        uses: actions/download-artifact@v4
        with:
          name: mincord-updater-dll
          path: .

      - name: Install dependencies
        run: npm ci

      - name: Build Electron Windows
        run: npm run build:desktop -- --publish never

      - name: Verify DLL in output
        run: |
          $dllPath = "dist/win-unpacked/MineCordUpdater.dll"
          if (-not (Test-Path $dllPath)) {
            Write-Error "ERROR: MineCordUpdater.dll not found in installer output at $dllPath"
            exit 1
          }
          Write-Host "? MineCordUpdater.dll found in installer output"

      - name: Upload Windows Electron artifact
        uses: actions/upload-artifact@v4
        with:
          name: mincord-windows-electron
          path: dist/*.exe
          retention-days: 7

  macos:
    name: macOS (Tauri)
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Import Apple certificates
        if: ${{ env.APPLE_CERT_P12_BASE64 != '' && env.APPLE_CERT_PASSWORD != '' }}
        run: |
          echo "$APPLE_CERT_P12_BASE64" | base64 -d > cert.p12
          security import cert.p12 -k ~/Library/Keychains/login.keychain-db -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$APPLE_CERT_PASSWORD" ~/Library/Keychains/login.keychain-db

      - name: Build Tauri macOS
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          MINECORD_UPDATER_PUBKEY: ${{ secrets.MINECORD_UPDATER_PUBKEY }}
          MINECORD_UPDATER_ENDPOINT: ${{ secrets.MINECORD_UPDATER_ENDPOINT }}
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: npm run tauri:build

      - name: Verify macOS DMG exists
        run: |
          set -e
          echo "Checking for DMG files..."
          find src-tauri/target -name "*.dmg" -type f | head -5
          DMG_COUNT=$(find src-tauri/target -name "*.dmg" -type f | wc -l)
          if [ "$DMG_COUNT" -eq 0 ]; then
            echo "ERROR: No DMG files found!"
            exit 1
          fi
          echo "Found $DMG_COUNT DMG file(s)"

      - name: Verify macOS App bundle exists
        run: |
          set -e
          echo "Checking for .app bundles..."
          find src-tauri/target -name "*.app" -type d | head -5
          APP_COUNT=$(find src-tauri/target -name "*.app" -type d | wc -l)
          if [ "$APP_COUNT" -eq 0 ]; then
            echo "ERROR: No .app bundles found!"
            exit 1
          fi
          echo "Found $APP_COUNT .app bundle(s)"

      - name: Notarize macOS artifacts
        if: ${{ env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != '' }}
        run: |
          for f in src-tauri/target/release/bundle/dmg/*.dmg; do
            if [ -f "$f" ]; then
              xcrun notarytool submit "$f" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
              xcrun stapler staple "$f"
            fi
          done
          for f in src-tauri/target/release/bundle/macos/*.app; do
            if [ -d "$f" ]; then
              xcrun notarytool submit "$f" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
              xcrun stapler staple "$f"
            fi
          done

      - name: Package macOS app bundle
        if: ${{ always() }}
        run: |
          set -e
          if [ -d "src-tauri/target/release/bundle/macos" ]; then
            cd src-tauri/target/release/bundle/macos
            for app in *.app; do
              if [ -d "$app" ]; then
                echo "Packaging $app..."
                zip -r "${app}.zip" "$app"
                tar -czf "${app}.tar.gz" "$app"
              fi
            done
          fi

      - name: Rename macOS artifacts for release
        if: ${{ always() }}
        run: |
          set -e
          # Rename DMG files to include architecture
          for f in src-tauri/target/**/bundle/dmg/*.dmg; do
            if [ -f "$f" ]; then
              if [[ "$f" == *"aarch64"* ]] || [[ "$f" == *"arm64"* ]]; then
                mv "$f" "$(dirname "$f")/MineCord-macOS-AppleSilicon.dmg"
              else
                mv "$f" "$(dirname "$f")/MineCord-macOS-Intel.dmg"
              fi
            fi
          done
          # Rename app bundles
          if [ -d "src-tauri/target/release/bundle/macos" ]; then
            cd src-tauri/target/release/bundle/macos
            for app in *.app; do
              if [ -d "$app" ]; then
                arch=$(echo "$app" | grep -oE '(aarch64|arm64|x86_64)' || echo 'x64')
                if [[ "$arch" == "aarch64" ]] || [[ "$arch" == "arm64" ]]; then
                  mv "$app" "MineCord-AppleSilicon.app"
                  mv "${app}.zip" "MineCord-AppleSilicon.app.zip" 2>/dev/null || true
                  mv "${app}.tar.gz" "MineCord-AppleSilicon.app.tar.gz" 2>/dev/null || true
                else
                  mv "$app" "MineCord-Intel.app"
                  mv "${app}.zip" "MineCord-Intel.app.zip" 2>/dev/null || true
                  mv "${app}.tar.gz" "MineCord-Intel.app.tar.gz" 2>/dev/null || true
                fi
              fi
            done
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mincord-macos
          path: |
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.zip
            src-tauri/target/release/bundle/macos/*.tar.gz
          retention-days: 7
          if-no-files-found: error

  linux:
    name: Linux (Tauri)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            fakeroot

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri Linux
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          MINECORD_UPDATER_PUBKEY: ${{ secrets.MINECORD_UPDATER_PUBKEY }}
          MINECORD_UPDATER_ENDPOINT: ${{ secrets.MINECORD_UPDATER_ENDPOINT }}
        run: npm run tauri:build

      - name: Verify Linux artifacts exist
        run: |
          set -e
          echo "Checking for AppImage files..."
          find src-tauri/target -name "*.AppImage" -type f | head -5
          APPIMAGE_COUNT=$(find src-tauri/target -name "*.AppImage" -type f | wc -l)
          if [ "$APPIMAGE_COUNT" -eq 0 ]; then
            echo "ERROR: No AppImage files found!"
            exit 1
          fi
          echo "Found $APPIMAGE_COUNT AppImage file(s)"
          echo "Checking for DEB files..."
          find src-tauri/target -name "*.deb" -type f | head -5
          echo "Checking for RPM files..."
          find src-tauri/target -name "*.rpm" -type f | head -5

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mincord-linux
          path: |
            src-tauri/target/**/bundle/appimage/*.AppImage
            src-tauri/target/**/bundle/deb/*.deb
            src-tauri/target/**/bundle/rpm/*.rpm
          retention-days: 7
          if-no-files-found: error

  android:
    name: Android (Tauri)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          api-level: 34
          ndk-version: r27c
          emulator: false
          cmdline-tools-version: latest
          cache-key: android-sdk-${{ runner.os }}-${{ hashFiles('src-tauri/gen/android/**') }}

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Regenerate Gradle wrapper
        run: |
          cd src-tauri/gen/android
          chmod +x gradlew
          ./gradlew wrapper --gradle-version 8.5 --distribution-type bin

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Android APK
        env:
          MINECORD_ANDROID_KEYSTORE_PATH: ${{ secrets.MINECORD_ANDROID_KEYSTORE_PATH }}
          MINECORD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MINECORD_ANDROID_KEYSTORE_PASSWORD }}
          MINECORD_ANDROID_KEY_ALIAS: ${{ secrets.MINECORD_ANDROID_KEY_ALIAS }}
          MINECORD_ANDROID_KEY_PASSWORD: ${{ secrets.MINECORD_ANDROID_KEY_PASSWORD }}
        run: |
          cd src-tauri/gen/android
          bash ./gradlew assembleRelease
          cd ../..

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: mincord-android
          path: src-tauri/gen/android/app/build/outputs/apk/release/*.apk
          retention-days: 7

  release:
    name: Create Release
    needs: [windows-tauri, windows-electron, macos, linux, android, build-updater-dll]
    if: github.event.inputs.create_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          find artifacts -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.zip" -o -name "*.tar.gz" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" -o -name "*.dll" -o -name "*.apk" \) | sort

      - name: Verify release artifacts exist
        run: |
          set -e
          echo "Verifying required release artifacts..."

          # Check Windows Tauri installer
          WIN_EXE=$(find artifacts/mincord-windows-tauri -name "*.exe" -type f 2>/dev/null | head -1)
          if [ -z "$WIN_EXE" ]; then
            echo "ERROR: Windows Tauri installer not found!"
            exit 1
          fi
          echo "✓ Windows Tauri installer: $WIN_EXE"

          # Check Windows Electron installer
          WIN_ELECTRON_EXE=$(find artifacts/mincord-windows-electron -name "*.exe" -type f 2>/dev/null | head -1)
          if [ -z "$WIN_ELECTRON_EXE" ]; then
            echo "ERROR: Windows Electron installer not found!"
            exit 1
          fi
          echo "✓ Windows Electron installer: $WIN_ELECTRON_EXE"

          # Check MineCordUpdater.dll in Electron package
          UPDATER_DLL=$(find artifacts/mincord-windows-electron -name "MineCordUpdater.dll" -type f 2>/dev/null | head -1)
          if [ -z "$UPDATER_DLL" ]; then
            echo "ERROR: MineCordUpdater.dll not found in Electron package!"
            exit 1
          fi
          echo "✓ MineCordUpdater.dll included in Windows Electron package"

          # Check macOS DMG (both architectures)
          MAC_DMG_INTEL=$(find artifacts/mincord-macos -name "*Intel*.dmg" -type f 2>/dev/null | head -1)
          MAC_DMG_ARM=$(find artifacts/mincord-macos -name "*AppleSilicon*.dmg" -type f 2>/dev/null | head -1)
          if [ -z "$MAC_DMG_INTEL" ] && [ -z "$MAC_DMG_ARM" ]; then
            echo "ERROR: macOS DMG not found!"
            exit 1
          fi
          if [ -n "$MAC_DMG_INTEL" ]; then echo "✓ macOS Intel DMG: $MAC_DMG_INTEL"; fi
          if [ -n "$MAC_DMG_ARM" ]; then echo "✓ macOS Apple Silicon DMG: $MAC_DMG_ARM"; fi

          # Check Linux AppImage
          LINUX_APPIMAGE=$(find artifacts/mincord-linux -name "*.AppImage" -type f 2>/dev/null | head -1)
          if [ -z "$LINUX_APPIMAGE" ]; then
            echo "ERROR: Linux AppImage not found!"
            exit 1
          fi
          echo "✓ Linux AppImage: $LINUX_APPIMAGE"

          # Check Android APK
          ANDROID_APK=$(find artifacts/mincord-android -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -z "$ANDROID_APK" ]; then
            echo "ERROR: Android APK not found!"
            exit 1
          fi
          echo "✓ Android APK: $ANDROID_APK"

          # Check optional: macOS app bundles
          MAC_ZIP=$(find artifacts/mincord-macos -name "*.zip" -type f 2>/dev/null | head -1)
          MAC_TAR=$(find artifacts/mincord-macos -name "*.tar.gz" -type f 2>/dev/null | head -1)
          if [ -n "$MAC_ZIP" ]; then echo "✓ macOS App zip: $MAC_ZIP"; fi
          if [ -n "$MAC_TAR" ]; then echo "✓ macOS App tar.gz: $MAC_TAR"; fi

          # Check optional: Linux DEB/RPM
          LINUX_DEB=$(find artifacts/mincord-linux -name "*.deb" -type f 2>/dev/null | head -1)
          LINUX_RPM=$(find artifacts/mincord-linux -name "*.rpm" -type f 2>/dev/null | head -1)
          if [ -n "$LINUX_DEB" ]; then echo "✓ Linux DEB: $LINUX_DEB"; fi
          if [ -n "$LINUX_RPM" ]; then echo "✓ Linux RPM: $LINUX_RPM"; fi

          echo "All required artifacts verified!"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: MINECORD v${{ github.event.inputs.version }}
          draft: false
          prerelease: false
          files: |
            artifacts/mincord-windows-tauri/*.exe
            artifacts/mincord-windows-electron/*.exe
            artifacts/mincord-windows-electron/*.dll
            artifacts/mincord-macos/*Intel*.dmg
            artifacts/mincord-macos/*AppleSilicon*.dmg
            artifacts/mincord-macos/*Intel*.zip
            artifacts/mincord-macos/*Intel*.tar.gz
            artifacts/mincord-macos/*AppleSilicon*.zip
            artifacts/mincord-macos/*AppleSilicon*.tar.gz
            artifacts/mincord-linux/*.AppImage
            artifacts/mincord-linux/*.deb
            artifacts/mincord-linux/*.rpm
            artifacts/mincord-android/*.apk
          body: |
            ## MINECORD v${{ github.event.inputs.version }}

            ### Windows
            - **Tauri (NSIS)**: `MINECORD_${{ github.event.inputs.version }}_x64-setup.exe` — Lightweight WebView2-based installer (~3 MB)
            - **Electron (NSIS)**: `MINECORD Setup ${{ github.event.inputs.version }}.exe` — Full Electron bundle (~120 MB) with MineCordUpdater.dll

            ### macOS
            - **DMG (Intel)**: `MINECORD-macOS-Intel.dmg`
            - **DMG (Apple Silicon)**: `MINECORD-macOS-AppleSilicon.dmg`
            - **App Bundle (Intel)**: `MineCord-Intel.app.zip` and `MineCord-Intel.app.tar.gz` (unsigned if no Apple credentials)
            - **App Bundle (Apple Silicon)**: `MineCord-AppleSilicon.app.zip` and `MineCord-AppleSilicon.app.tar.gz` (unsigned if no Apple credentials)

            ### Linux
            - **AppImage**: `MINECORD_${{ github.event.inputs.version }}_amd64.AppImage`
            - **DEB**: `MINECORD_${{ github.event.inputs.version }}_amd64.deb`
            - **RPM**: `MINECORD_${{ github.event.inputs.version }}_amd64.rpm`

            ### Android
            - **APK**: `MINECORD_${{ github.event.inputs.version }}_universal.apk`

            ### Notes
            - Tauri builds use the MINECORD updater with minisign signature verification
            - All Tauri artifacts are signed with minisign (public key embedded in app)
            - macOS artifacts are signed/notarized only if Apple Developer credentials are provided

            ### Installation
            - **Windows**: Run the `.exe` installer
            - **macOS**: Open the `.dmg` and drag `MINECORD.app` to Applications, or unzip `.zip` and copy
            - **Linux**: Run the `.AppImage` (make executable first), or install `.deb`/`.rpm` via package manager
            - **Android**: Install the `.apk` (enable "Install unknown apps" if needed)

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
