name: Developer Portal Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: ['dev/**', 'minecord-cloud-migration']

permissions:
  contents: read

jobs:
  test-and-build:
    name: Tests and web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run test suite
        run: npm test
      - name: Build web application
        run: npm run build
