name: MineCordUpdater DLL Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0.2)'
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - 'updater/**'
      - 'scripts/build-updater.ps1'
      - '.github/workflows/updater-dll-build.yml'

permissions:
  contents: write

env:
  UPLOADER_PUBKEY: ${{ secrets.MINECORD_UPDATER_PUBKEY }}

jobs:
  build-updater-dll:
    name: Build MineCordUpdater.dll (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28'

      - name: Install NSIS
        run: |
          choco install nsis --no-progress --confirm
        shell: pwsh

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: |
            updater/build
          key: ${{ runner.os }}-cmake-updater-${{ hashFiles('updater/CMakeLists.txt', 'updater/src/**') }}
          restore-keys: |
            ${{ runner.os }}-cmake-updater-

      - name: Setup VC++ env, Configure & Build with Ninja
        run: |
          Write-Host "=== Setting up VC++ environment using vswhere ==="
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            Write-Error "vswhere.exe not found at $vswhere"
            exit 1
          }
          # Find latest VS installation (any edition) with VC++ tools
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) {
            Write-Error "No Visual Studio installation with VC++ tools found"
            exit 1
          }
          $vcvarsall = Join-Path $vsPath "VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path $vcvarsall)) {
            Write-Error "vcvarsall.bat not found at $vcvarsall"
            exit 1
          }
          Write-Host "Found VS at: $vsPath"
          Write-Host "Found vcvarsall at: $vcvarsall"
          Write-Host "Running vcvarsall.bat for x64..."
          $env:VCVARS_VER = "14.40"
          $output = cmd /c "`"$vcvarsall`" x64 && set" 2>&1
          $output | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              Set-Item -Path "Env:$($matches[1])" -Value $matches[2] -Force
            }
          }
          Write-Host "VC++ environment configured"
          
          Write-Host "=== Configuring CMake with Ninja ==="
          cmake -B updater/build -S updater -DCMAKE_BUILD_TYPE=Release -G Ninja
          
          Write-Host "=== Building MineCordUpdater.dll ==="
          cmake --build updater/build --config Release --parallel
          
          Write-Host "=== Dump DLL exports (diagnostic) ==="
          $dllPath = "updater/build/Release/MineCordUpdater.dll"
          if (Test-Path $dllPath) {
            Write-Host "=== DLL Export Table ==="
            dumpbin /exports $dllPath
            Write-Host "========================="
          } else {
            Write-Error "DLL not found at $dllPath"
            exit 1
          }
          
          Write-Host "=== Build complete ==="
        shell: pwsh

      - name: Verify DLL
        run: |
          $dllPath = "updater/build/Release/MineCordUpdater.dll"
          if (-not (Test-Path $dllPath)) {
            Write-Error "ERROR: MineCordUpdater.dll not found at $dllPath"
            exit 1
          }
          $dllInfo = Get-Item $dllPath
          Write-Host "DLL built successfully: $($dllInfo.FullName) ($($dllInfo.Length / 1KB) KB)"

      - name: Test DLL Load and Functions
        run: |
          if (-not (Test-Path "node_modules/koffi")) { npm install koffi --prefix . }
          $testPath = Join-Path $PWD 'test-dll.cjs'
          $jsCode = @(
            "const koffi = require('koffi');"
            "const path = require('path');"
            ""
            "const dllPath = path.join(process.cwd(), 'updater/build/Release/MineCordUpdater.dll');"
            "console.log('Loading DLL from:', dllPath);"
            ""
            "try {"
            "  const lib = koffi.load(dllPath);"
            ""
            "  // Define functions with correct types per C header (wchar_t* = wstring, void* = void*)"
            "  const GetUpdaterVersion = lib.func('GetUpdaterVersion', 'wstring', []);"
            "  console.log('GetUpdaterVersion func returned:', typeof GetUpdaterVersion);"
            "  const version = GetUpdaterVersion();"
            "  console.log('Updater version:', version);"
            ""
            "  const GetUpdaterLastError = lib.func('GetUpdaterLastError', 'wstring', []);"
            "  console.log('GetUpdaterLastError func returned:', typeof GetUpdaterLastError);"
            ""
            "  const CheckForUpdates = lib.func('CheckForUpdates', 'int', ['wstring', 'wstring', 'wstring', 'wstring', 'wstring', 'void*']);"
            "  console.log('CheckForUpdates func returned:', typeof CheckForUpdates);"
            "  const FreeUpdateInfo = lib.func('FreeUpdateInfo', 'void', ['void*']);"
            "  console.log('FreeUpdateInfo func returned:', typeof FreeUpdateInfo);"
            ""
            "  // Allocate pointer-to-pointer (void**) for outInfo param"
            "  const outInfo = koffi.alloc('void*', 1);"
            "  const result = CheckForUpdates('http://localhost:3000', '1.0.2', 'windows', 'x64', 'stable', outInfo);"
            "  console.log('CheckForUpdates result:', result);"
            "  if (result === -3) { console.log('CheckForUpdates correctly returns NO_UPDATE for unreachable server'); }"
            "  else if (result === 0) {"
            "    const infoPtr = outInfo.deref();"
            "    console.log('Update version:', infoPtr.version);"
            "    FreeUpdateInfo(infoPtr);"
            "  }"
            ""
            "  const error = GetUpdaterLastError();"
            "  console.log('Last error:', error);"
            "  console.log('All DLL functions tested successfully');"
            "} catch (err) {"
            "  console.error('DLL test failed:', err.message);"
            "  console.error(err.stack);"
            "  process.exit(1);"
            "}"
          ) -join "`n"
          Set-Content -Path $testPath -Value $jsCode -Encoding UTF8
          try { node $testPath } finally { Remove-Item -Force $testPath -ErrorAction SilentlyContinue }
        shell: pwsh

      - name: Build MineCordUpdaterSetup.exe (NSIS Installer)
        run: |
          Write-Host "=== Building MineCordUpdaterSetup.exe ==="
          # Copy DLL to updater directory for NSIS
          $src = "updater/build/Release/MineCordUpdater.dll"
          $dest = "updater/MineCordUpdater.dll"
          Copy-Item $src $dest -Force
          
          # Build NSIS installer
          $nsisScript = "updater/MineCordUpdaterSetup.nsi"
          $nsisPath = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $nsisPath)) {
            $nsisPath = "C:\Program Files\NSIS\makensis.exe"
          }
          & $nsisPath $nsisScript
          if ($LASTEXITCODE -ne 0) {
            Write-Error "NSIS installer build failed"
            exit 1
          }
          
          # Move installer to dist
          $outputDir = "dist"
          if (-not (Test-Path $outputDir)) {
            New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
          }
          $installerBuilt = "updater/MineCordUpdaterSetup.exe"
          $installerOutput = "dist/MineCordUpdaterSetup.exe"
          Move-Item $installerBuilt -Destination $installerOutput -Force
          
          # Cleanup
          Remove-Item $dest -Force -ErrorAction SilentlyContinue
          
          Write-Host "Installer created: $installerOutput"
        shell: pwsh

      - name: Upload MineCordUpdater.dll
        uses: actions/upload-artifact@v4
        with:
          name: mincord-updater-dll
          path: updater/build/Release/MineCordUpdater.dll
          retention-days: 7
          if-no-files-found: error

      - name: Upload MineCordUpdaterSetup.exe
        uses: actions/upload-artifact@v4
        with:
          name: mincord-updater-installer
          path: dist/MineCordUpdaterSetup.exe
          retention-days: 7
          if-no-files-found: error

      - name: Install minisign
        run: |
          choco install minisign --no-progress --confirm
        shell: pwsh

      - name: Test Signature Verification
        run: |
          $testPath = Join-Path $env:TEMP 'test-sig.cjs'
          $jsCode = @(
            "const fs = require('fs');"
            "const path = require('path');"
            "const { spawnSync } = require('child_process');"
            ""
            "console.log('Testing signature verification...');"
            "const pubKeyPath = path.join(process.env.USERPROFILE, '.minisign', 'minisign.pub');"
            "if (fs.existsSync(pubKeyPath)) {"
            "  const pubKey = fs.readFileSync(pubKeyPath, 'utf8');"
            "  console.log('Public key file exists');"
            "  console.log('  Key:', pubKey.split('\n')[0]);"
            "} else {"
            "  console.log('Public key not found at', pubKeyPath);"
            "}"
            "try {"
            "  const result = spawnSync('minisign', ['-V'], { encoding: 'utf8' });"
            "  if (result.status === 0) {"
            "    console.log('minisign binary available:', result.stdout.trim());"
            "  } else {"
            "    console.log('minisign binary not found in PATH');"
            "  }"
            "} catch (e) {"
            "  console.log('minisign binary not found in PATH');"
            "}"
            "console.log('Signature verification test structure ready');"
          ) -join "`n"
          Set-Content -Path $testPath -Value $jsCode -Encoding UTF8
          try { node $testPath } finally { Remove-Item -Force $testPath -ErrorAction SilentlyContinue }
        shell: pwsh

  # Windows Electron packaging job - runs after DLL is built
  windows-electron:
    name: Windows (Electron) with Updater DLL
    runs-on: windows-latest
    timeout-minutes: 30
    needs: build-updater-dll
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Download MineCordUpdater.dll
        uses: actions/download-artifact@v4
        with:
          name: mincord-updater-dll
          path: updater/build/Release

      - name: Install dependencies
        run: npm install

      - name: Generate edition config (Electron Full)
        run: node scripts/generate-edition.js electron

      - name: Generate Windows icon
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\generate-windows-icon.ps1

      - name: Build Electron Windows (no bundled DLL)
        run: npx electron-builder --publish never

      - name: Debug output directory
        run: |
          Write-Host "=== Contents of dist ==="
          Get-ChildItem dist -Recurse | Select-Object FullName, Length
        shell: pwsh

      - name: Verify NO DLL in output (uses shared installed DLL)
        run: |
          $dllPath = "dist/win-unpacked/resources/MineCordUpdater.dll"
          if (Test-Path $dllPath) {
            Write-Error "ERROR: MineCordUpdater.dll should NOT be bundled in Electron package (uses shared installed DLL)"
            exit 1
          }
          Write-Host "OK: MineCordUpdater.dll NOT bundled (uses shared installed DLL)"
        shell: pwsh

  - name: Package Electron Full Edition ZIP
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\package-electron-zip.ps1 -Version "${{ github.event.inputs.version || '1.0.2' }}"

      - name: Verify Electron ZIP (no DLL)
        run: |
          $zipPath = "dist/MineCord-Electron-Full-v${{ github.event.inputs.version || '1.0.2' }}-Windows-x64.zip"
          $tempDir = Join-Path $env:TEMP "verify_electron_$([guid]::NewGuid())"
          New-Item -ItemType Directory -Path $tempDir -Force | Out-Null
          try {
            $sevenZip = "C:\Program Files\7-Zip\7z.exe"
            if (-not (Test-Path $sevenZip)) { $sevenZip = "C:\Program Files (x86)\7-Zip\7z.exe" }
            & $sevenZip x "dist/MineCord-Electron-Full-v${{ github.event.inputs.version || '1.0.2' }}-Windows-x64.zip" -o$tempDir -y | Out-Null
            $dllInZip = Get-ChildItem -Recurse -Path $tempDir -Filter "MineCordUpdater.dll" -ErrorAction SilentlyContinue
            if ($dllInZip) {
              Write-Error "FAIL: MineCordUpdater.dll found in Electron ZIP"
            } else {
              Write-Host "OK: No MineCordUpdater.dll in Electron ZIP"
            }
          } finally {
            Remove-Item $tempDir -Recurse -Force -ErrorAction SilentlyContinue
          }
        shell: pwsh

      - name: Upload Windows Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mincord-windows-electron
          path: |
            dist/*.exe
            dist/MineCord-Electron-Full-v*.zip
          retention-days: 7

  # Update release job to include DLL verification
  release:
    name: Create Release
    needs: [windows-electron, build-updater-dll]
    if: github.event.inputs.create_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          find artifacts -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.zip" -o -name "*.tar.gz" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" -o -name "*.dll" \) | sort

      - name: Verify release artifacts exist
        run: |
          set -e
          echo "Verifying required release artifacts..."

          # Check Windows Tauri installer
          WIN_EXE=$(find artifacts/mincord-windows-tauri -name "*.exe" -type f 2>/dev/null | head -1)
          if [ -z "$WIN_EXE" ]; then
            echo "ERROR: Windows Tauri installer not found!"
            exit 1
          fi
          echo "Windows Tauri installer: $WIN_EXE"

          # Check Windows Electron installer
          WIN_ELECTRON_EXE=$(find artifacts/mincord-windows-electron -name "*.exe" -type f 2>/dev/null | head -1)
          if [ -z "$WIN_ELECTRON_EXE" ]; then
            echo "ERROR: Windows Electron installer not found!"
            exit 1
          fi
          echo "Windows Electron installer: $WIN_ELECTRON_EXE"

          # Check Windows Electron ZIP
          WIN_ELECTRON_ZIP=$(find artifacts/mincord-windows-electron -name "MineCord-Electron-Full-*.zip" -type f 2>/dev/null | head -1)
          if [ -z "$WIN_ELECTRON_ZIP" ]; then
            echo "WARNING: Windows Electron ZIP not found!"
          else
            echo "Windows Electron ZIP: $WIN_ELECTRON_ZIP"
          fi

          # Check MineCordUpdaterSetup.exe (shared installer)
          UPDATER_INSTALLER=$(find artifacts/mincord-updater-installer -name "*.exe" -type f 2>/dev/null | head -1)
          if [ -z "$UPDATER_INSTALLER" ]; then
            echo "ERROR: MineCordUpdaterSetup.exe not found!"
            exit 1
          fi
          echo "MineCordUpdaterSetup.exe: $UPDATER_INSTALLER"

          # Check macOS DMG (both architectures)
          MAC_DMG_INTEL=$(find artifacts/mincord-macos -name "*Intel*.dmg" -type f 2>/dev/null | head -1)
          MAC_DMG_ARM=$(find artifacts/mincord-macos -name "*AppleSilicon*.dmg" -type f 2>/dev/null | head -1)
          if [ -z "$MAC_DMG_INTEL" ] && [ -z "$MAC_DMG_ARM" ]; then
            echo "ERROR: macOS DMG not found!"
            exit 1
          fi
          if [ -n "$MAC_DMG_INTEL" ]; then echo "macOS Intel DMG: $MAC_DMG_INTEL"; fi
          if [ -n "$MAC_DMG_ARM" ]; then echo "macOS Apple Silicon DMG: $MAC_DMG_ARM"; fi

          # Check Linux AppImage
          LINUX_APPIMAGE=$(find artifacts/mincord-linux -name "*.AppImage" -type f 2>/dev/null | head -1)
          if [ -z "$LINUX_APPIMAGE" ]; then
            echo "ERROR: Linux AppImage not found!"
            exit 1
          fi
          echo "Linux AppImage: $LINUX_APPIMAGE"

          # Check Android APK
          ANDROID_APK=$(find artifacts/mincord-android -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -z "$ANDROID_APK" ]; then
            echo "ERROR: Android APK not found!"
            exit 1
          fi
          echo "Android APK: $ANDROID_APK"

          # Check optional: macOS app bundles
          MAC_ZIP=$(find artifacts/mincord-macos -name "*.zip" -type f 2>/dev/null | head -1)
          MAC_TAR=$(find artifacts/mincord-macos -name "*.tar.gz" -type f 2>/dev/null | head -1)
          if [ -n "$MAC_ZIP" ]; then echo "macOS App zip: $MAC_ZIP"; fi
          if [ -n "$MAC_TAR" ]; then echo "macOS App tar.gz: $MAC_TAR"; fi

          # Check optional: Linux DEB/RPM
          LINUX_DEB=$(find artifacts/mincord-linux -name "*.deb" -type f 2>/dev/null | head -1)
          LINUX_RPM=$(find artifacts/mincord-linux -name "*.rpm" -type f 2>/dev/null | head -1)
          if [ -n "$LINUX_DEB" ]; then echo "Linux DEB: $LINUX_DEB"; fi
          if [ -n "$LINUX_RPM" ]; then echo "Linux RPM: $LINUX_RPM"; fi

          echo "All required artifacts verified!"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: MINECORD v${{ github.event.inputs.version }}
          draft: false
          prerelease: false
          files: |
            artifacts/mincord-windows-tauri/*.exe
            artifacts/mincord-windows-electron/*.exe
            artifacts/mincord-windows-electron/MineCord-Electron-Full-*.zip
            artifacts/mincord-updater-installer/*.exe
            artifacts/mincord-macos/*Intel*.dmg
            artifacts/mincord-macos/*AppleSilicon*.dmg
            artifacts/mincord-macos/*Intel*.zip
            artifacts/mincord-macos/*Intel*.tar.gz
            artifacts/mincord-macos/*AppleSilicon*.zip
            artifacts/mincord-macos/*AppleSilicon*.tar.gz
            artifacts/mincord-linux/*.AppImage
            artifacts/mincord-linux/*.deb
            artifacts/mincord-linux/*.rpm
            artifacts/mincord-android/*.apk
          body: |
            ## MINECORD v${{ github.event.inputs.version }}

            ### Windows
            - **Tauri (NSIS)**: `MINECORD_${{ github.event.inputs.version }}_x64-setup.exe` â€” Lightweight WebView2-based installer (~3 MB)
            - **Tauri Lite (ZIP)**: `MineCord-Tauri-Lite-v${{ github.event.inputs.version }}_Windows-x64.zip` â€” Lightweight portable edition (~10 MB)
            - **Electron (NSIS)**: `MINECORD Setup ${{ github.event.inputs.version }}.exe` â€” Full Electron bundle (~120 MB)
            - **Electron Full (ZIP)**: `MineCord-Electron-Full-v${{ github.event.inputs.version }}_Windows-x64.zip` â€” Full portable edition (~120 MB)
            - **MineCord Updater (Shared)**: `MineCordUpdaterSetup.exe` â€” Installs shared MineCordUpdater.dll to `%ProgramFiles%\MineCord\` (required for both Windows editions)

            ### macOS
            - **DMG (Intel)**: `MINECORD-macOS-Intel.dmg`
            - **DMG (Apple Silicon)**: `MINECORD-macOS-AppleSilicon.dmg`
            - **App Bundle (Intel)**: `MineCord-Intel.app.zip` and `MineCord-Intel.app.tar.gz` (unsigned if no Apple credentials)
            - **App Bundle (Apple Silicon)**: `MineCord-AppleSilicon.app.zip` and `MineCord-AppleSilicon.app.tar.gz` (unsigned if no Apple credentials)

            ### Linux
            - **AppImage**: `MINECORD_${{ github.event.inputs.version }}_amd64.AppImage`
            - **DEB**: `MINECORD_${{ github.event.inputs.version }}_amd64.deb`
            - **RPM**: `MINECORD_${{ github.event.inputs.version }}_amd64.rpm`

            ### Android
            - **APK**: `MINECORD_${{ github.event.inputs.version }}_universal.apk`

            ### Notes
            - Windows editions use shared MineCordUpdater.dll installed via MineCordUpdaterSetup.exe
            - Tauri builds use the MINECORD updater with minisign signature verification
            - All Tauri artifacts are signed with minisign (public key embedded in app)
            - macOS artifacts are signed/notarized only if Apple Developer credentials are provided
            - Windows Electron and Tauri Lite use the same native updater DLL

            ### Installation
            - **Windows**: 
              1. Run `MineCordUpdaterSetup.exe` first (installs shared updater DLL to `%ProgramFiles%\MineCord\`)
              2. For portable ZIP editions: Extract ZIP and run `MINECORD.exe`
              3. For installer editions: Run the `.exe` installer
            - **macOS**: Open the `.dmg` and drag `MINECORD.app` to Applications, or unzip `.zip` and copy
            - **Linux**: Run the `.AppImage` (make executable first), or install `.deb`/`.rpm` via package manager
            - **Android**: Install the `.apk` (enable "Install unknown apps" if needed)

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
