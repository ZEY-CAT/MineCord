plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.minecord.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.minecord.app"
        minSdk 24
        targetSdk 34
        versionCode 1001
        versionName "1.0.1"
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            debuggable true
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            // Release signing configured via environment variables or local.properties
            // MINECORD_ANDROID_KEYSTORE_PATH, MINECORD_ANDROID_KEYSTORE_PASSWORD, MINECORD_ANDROID_KEY_ALIAS, MINECORD_ANDROID_KEY_PASSWORD
            if (project.hasProperty("MINECORD_ANDROID_KEYSTORE_PATH")) {
                storeFile file(project.property("MINECORD_ANDROID_KEYSTORE_PATH"))
                storePassword project.property("MINECORD_ANDROID_KEYSTORE_PASSWORD")
                keyAlias project.property("MINECORD_ANDROID_KEY_ALIAS")
                keyPassword project.property("MINECORD_ANDROID_KEY_PASSWORD")
            }
        }
    }

    packagingOptions {
        resources {
            excludes += ["META-INF/*"]
        }
        jniLibs {
            useLegacyPackaging = true
        }
    }

    ndkVersion "27.0.12077973"
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.activity:activity-ktx:1.9.3"
    implementation "androidx.fragment:fragment-ktx:1.8.2"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.webkit:webkit:1.12.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.4"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.8.4"

    // Tauri dependencies
    implementation "com.tauri:tauri-android:2.0.0"
    implementation "org.slf4j:slf4j-android:2.0.13"
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        freeCompilerArgs += "-Xopt-in=kotlin.RequiresOptIn"
    }
}