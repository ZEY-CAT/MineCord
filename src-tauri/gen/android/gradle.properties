# Gradle properties for MINECORD Android build
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:ActiveProcessorCount=2 -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.configureondemand=true

# Android build settings
android.useAndroidX=true
android.enableJetifier=true

# Kotlin settings
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process

# Tauri settings
tauri.android.minSdkVersion=24
tauri.android.targetSdkVersion=34
