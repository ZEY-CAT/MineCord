[package]
name = "minecord-desktop"
version = "1.0.2"
description = "MINECORD cross-platform desktop and mobile application"
authors = ["MINECORD"]
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/ZEY-CAT/MineCord"

[lib]
name = "minecord_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-updater = { version = "2", default-features = false, features = [] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
