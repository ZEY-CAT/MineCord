[package]
name = "minecord-desktop"
version = "1.0.1"
description = "MINECORD Windows desktop application"
authors = ["MINECORD"]
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
