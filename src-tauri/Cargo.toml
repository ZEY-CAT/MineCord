[package]
name = "minecord-desktop"
version = "1.0.2"
description = "MINECORD cross-platform desktop and mobile application"
authors = ["MINECORD"]
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/ZEY-CAT/MineCord"

[lib]
name = "minecord_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

# Windows native updater bridge
[target.'cfg(target_os = "windows")'.dependencies]
libloading = "0.8"

# Non-Windows platforms use tauri-plugin-updater
[target.'cfg(not(target_os = "windows"))'.dependencies]
tauri-plugin-updater = { version = "2", default-features = false, features = [] }
# reqwest 0.13 gates the deprecated TLS-bypass methods used by
# tauri-plugin-updater behind its internal `__tls` feature. Enable rustls so
# feature unification turns that feature on and the updater compiles.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

# Mobile support (Android) - conditional compilation
[target.'cfg(target_os = "android")'.dependencies]
ndk-glue = "0.7"
jni = { version = "0.22", features = ["invocation"] }
log = "0.4"
android-activity = "0.5"
ndk-context = "0.1"
